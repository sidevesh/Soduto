# Builds an installable Soduto.dmg on a GitHub-hosted Mac.
#
# Signing: Xcode signs ad hoc ("Sign to Run Locally"). When the repository has the secrets
# SODUTO_SIGNING_P12 (base64 of a .p12 holding a self-signed code-signing certificate) and
# SODUTO_SIGNING_PASSWORD (scripts/create-signing-certificate.sh creates both), the finished app is
# re-signed with that certificate. Its code identity then stays the same from build to build, so macOS
# keeps the Accessibility grant and keychain access across updates. Either way the build is not
# notarized: after installing, clear the quarantine flag once (see the README) or use
# System Settings › Privacy & Security › Open Anyway.
#
# Triggers: every push, pull requests, version tags (v*), and manually from the Actions tab.
# The DMG is uploaded as a workflow artifact; for a v* tag it is also attached to a GitHub release.

name: Build DMG

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle identifier for the app (keep the default to replace an existing Soduto install and keep its pairings)
        required: false
        default: com.soduto.Soduto

permissions:
  contents: write  # attach the DMG to a release for v* tags

concurrency:
  group: build-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package
    # The project uses an Icon Composer `.icon` app icon, which needs Xcode 26
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ inputs.bundle_id || 'com.soduto.Soduto' }}
      DERIVED_DATA: ${{ github.workspace }}/build

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so `git describe` can name the build

      - name: Select Xcode 26
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then XCODE_APP=/Applications/Xcode.app; fi
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Name the build
        id: version
        run: |
          # Runs before the work tree is modified below, so the name has no "-dirty" suffix
          VERSION=$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)
          SAFE_REF=$(echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | tr '/' '-' | tr -cd '[:alnum:]._-')
          echo "dmg_name=Soduto-${SAFE_REF}-${VERSION}.dmg" >> "$GITHUB_OUTPUT"
          echo "artifact_name=Soduto-${SAFE_REF}-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Write local build configuration
        run: |
          # Config.xcconfig includes the untracked LocalConfig.xcconfig, which supplies BUNDLE_ID and
          # DEVELOPMENT_TEAM. CI has no team: the app is signed ad hoc below.
          cat > LocalConfig.xcconfig <<EOF
          DEVELOPMENT_TEAM =
          BUNDLE_ID = $BUNDLE_ID
          EOF
          cat LocalConfig.xcconfig

          # Signing overrides for the ad-hoc CI build, passed with `-xcconfig` so they take precedence over
          # the project's settings (conditional `[sdk=...]` keys can't be given on the xcodebuild command line).
          # Ad-hoc signing keeps the entitlements (sandbox, app group, network), which the Share extension
          # needs to load. Hardened runtime is only required for notarization and is turned off so ad-hoc
          # signed frameworks pass library validation.
          cat > "$RUNNER_TEMP/ci-signing.xcconfig" <<EOF
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = -
          CODE_SIGN_IDENTITY[sdk=macosx*] = -
          DEVELOPMENT_TEAM =
          PROVISIONING_PROFILE_SPECIFIER =
          ENABLE_HARDENED_RUNTIME = NO
          // Don't add the debugging-only get-task-allow entitlement to a distributed build
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS = NO
          EOF

          # Sparkle's feed (SUFeedURL) is the upstream fork's appcast. Don't let this build check it
          # automatically and offer to replace itself with that fork's release.
          plutil -replace SUEnableAutomaticChecks -bool NO Soduto/Info.plist

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Soduto.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Soduto.xcodeproj \
            -scheme Soduto \
            -clonedSourcePackagesDirPath "$DERIVED_DATA/SourcePackages"

      - name: Build (Release, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Soduto.xcodeproj \
            -scheme Soduto \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$DERIVED_DATA/SourcePackages" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -xcconfig "$RUNNER_TEMP/ci-signing.xcconfig" \
            2>&1 | tee xcodebuild.log | grep -E 'error:|warning: .*(entitlement|sign)|\*\* BUILD' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' xcodebuild.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Import signing certificate
        id: signing
        env:
          SIGNING_P12: ${{ secrets.SODUTO_SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.SODUTO_SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_P12" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "No SODUTO_SIGNING_P12 / SODUTO_SIGNING_PASSWORD secrets: keeping the ad-hoc signature"
            echo "identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/soduto-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          
          # Trust the self-signed certificate for code signing so it shows up as a valid identity. If that
          # isn't possible, codesign still signs with it when given its SHA-1 hash (below).
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -passin env:SIGNING_PASSWORD -nokeys -clcerts -out "$RUNNER_TEMP/signing-cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing-cert.pem" \
            || sudo security add-trusted-cert -d -r trustAsRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing-cert.pem" \
            || echo "::warning::Couldn't mark the signing certificate as trusted; signing by hash"
          rm -f "$RUNNER_TEMP/signing.p12"
          
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/[0-9A-F]{40}/ { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | awk '/[0-9A-F]{40}/ { print $2; exit }')
          fi
          if [ -z "$IDENTITY" ]; then
            security find-identity -p codesigning "$KEYCHAIN"
            echo "::error::SODUTO_SIGNING_P12 doesn't contain a code-signing certificate and private key"
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
      
      - name: Re-sign with the stable certificate
        if: steps.signing.outputs.identity != ''
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          APP="$DERIVED_DATA/Build/Products/Release/Soduto.app"
          # Re-sign every nested component (frameworks, XPC services, Soduto Files, the Share extension,
          # the login helper) and the app, keeping each one's own entitlements
          codesign --force --deep --sign "$IDENTITY" --keychain "$KEYCHAIN" \
            --preserve-metadata=entitlements,flags --timestamp=none "$APP"
          echo "Designated requirement (what TCC and the keychain match against):"
          codesign --display --requirements - "$APP"
      
      - name: Inspect the app
        run: |
          APP="$DERIVED_DATA/Build/Products/Release/Soduto.app"
          test -d "$APP"
          echo "Bundle id: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")"
          echo "Version:   $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist"))"
          lipo -archs "$APP/Contents/MacOS/Soduto"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --entitlements - "$APP"

      - name: Create DMG
        run: |
          APP="$DERIVED_DATA/Build/Products/Release/Soduto.app"
          STAGING=$(mktemp -d)
          ditto "$APP" "$STAGING/Soduto.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname Soduto \
            -srcfolder "$STAGING" \
            -fs HFS+ \
            -format UDZO \
            -ov \
            "${{ steps.version.outputs.dmg_name }}"
          hdiutil verify "${{ steps.version.outputs.dmg_name }}"
          shasum -a 256 "${{ steps.version.outputs.dmg_name }}" | tee "${{ steps.version.outputs.dmg_name }}.sha256"

      - name: Upload DMG
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            ${{ steps.version.outputs.dmg_name }}
            ${{ steps.version.outputs.dmg_name }}.sha256
          if-no-files-found: error

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
      
      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.version.outputs.dmg_name }}
            ${{ steps.version.outputs.dmg_name }}.sha256
          prerelease: true
          generate_release_notes: true
